version: 2

# ─── App identity ────────────────────────────────────────────────────────────
name: PNL_DASHBOARD
label: "P&L Analytics Dashboard"
description: "Financial P&L waterfall and Cortex Agent chat for SAP-sourced data."
icon: public/icon.svg

# ─── Deployment baseline (shared across all targets) ─────────────────────────
# Override individual fields per target below.
# To add a new deployment target:
#   1. Add a named block under `targets:`
#   2. Override database / schema / query_warehouse as needed
#   3. Deploy with: snow app deploy --target <name>
#
# IMPORTANT: snow app deploy is run from inside .next/standalone/ (see the
# GitHub Actions workflow and the local deploy instructions in README.md).
# This manifest therefore lives in .next/standalone/ at deploy time, and
# all paths (icon, run command) are relative to that directory.
#
database:        SAP_BDC_PNL
schema:          FIN
query_warehouse: SAP_BDC_PNL_WH

auto_suspend_secs: 300     # suspend after 5 min idle

default_target: dev

targets:
  # Local / personal development — uses your default Snow CLI connection
  dev: {}

  # Customer demo environment — override database/warehouse per engagement
  customer:
    query_warehouse: SAP_BDC_PNL_WH  # override if the target account uses a different name

# ─── Environment variables available to the running service ──────────────────
environment_variables:
  - name: NEXT_PUBLIC_SF_DATABASE
    value: "SAP_BDC_PNL"
  - name: NEXT_PUBLIC_SF_AGENT
    value: "SAP_BDC_PNL.FIN.S4_FIN_PNL_AGENT"

# ─── Builder phases ───────────────────────────────────────────────────────────
# snow app deploy is run from INSIDE .next/standalone/ after the build.
# That directory already contains everything needed (server.js, node_modules/,
# .next/static/, public/). No build steps required in the SAR builder.
install:
  commands:
    - ["echo", "Pre-built — skipping npm ci"]

build:
  commands:
    - ["echo", "Pre-built — skipping npm build"]

# server.js is at the root of the upload (which IS .next/standalone/)
run:
  command: ["node", "server.js"]
