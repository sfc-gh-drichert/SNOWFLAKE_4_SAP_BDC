name: Deploy S4.FIN.PNL — S4 FIN PNL Demo

# Colleagues trigger this from the GitHub Actions UI:
# Actions tab → "Deploy S4.FIN.PNL — S4 FIN PNL Demo" → Run workflow
on:
  workflow_dispatch:
    inputs:
      warehouse:
        description: 'Snowflake warehouse name'
        required: true
        default: 'SAP_BDC_PNL_WH'
      database:
        description: 'Target Snowflake database'
        required: true
        default: 'SAP_BDC_PNL'
      action:
        description: 'What to deploy'
        required: true
        type: choice
        options:
          - ping               # Connection test only — no SQL, no objects needed
          - all                # Full setup: files 01–09
          - rbac-only          # RBAC + Row Access Policy only (03)
          - data-only          # Fact table + 100K row seed (04–05)
          - search-agent-only  # Documents, Semantic View, Agent (06–08)
          - react-dashboard-only  # Build + deploy the React dashboard (SAR)
          - verify             # Full verification queries (09) — run after 'all'
          - teardown           # Drop all S4 FIN demo objects
        default: ping
      deploy_target:
        description: 'app.yml target for react-dashboard-only (e.g. customer, dev)'
        required: false
        default: 'customer'

jobs:
  deploy:
    name: Deploy (${{ inputs.action }}) → ${{ inputs.database }}.FIN
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Snowflake CLI
        run: |
          pip install snowflake-cli
          snow --version

      # Build the connection config from GitHub Secrets.
      # SNOWFLAKE_ACCOUNT     — account identifier (e.g. orgname-accountname)
      # SNOWFLAKE_USER        — service user, e.g. DEMO_GITHUB_ACTIONS
      # SNOWFLAKE_PRIVATE_KEY — full PEM contents of demo_cicd.p8,
      #                         including -----BEGIN PRIVATE KEY----- headers
      # Key pair auth (SNOWFLAKE_JWT) does not go through Okta/SSO.
      - name: Configure Snowflake connection
        env:
          SNOWFLAKE_ACCOUNT:     ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER:        ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.snowflake
          cat > ~/.snowflake/config.toml << TOMLEOF
          [connections.default]
          account          = "${SNOWFLAKE_ACCOUNT}"
          user             = "${SNOWFLAKE_USER}"
          authenticator    = "SNOWFLAKE_JWT"
          private_key_path = "/tmp/rsa_key.p8"
          role             = "ACCOUNTADMIN"
          TOMLEOF
          printf '%s' "${SNOWFLAKE_PRIVATE_KEY}" > /tmp/rsa_key.p8
          chmod 0600 /tmp/rsa_key.p8
          chmod 0600 ~/.snowflake/config.toml

      # Confirms key pair auth is working before running any SQL files.
      # Uses CURRENT_USER() — a metadata query that needs no warehouse,
      # so this works even before the first deploy creates SAP_BDC_PNL_WH.
      - name: Test connection
        run: |
          echo "==> Testing connection to Snowflake..."
          snow sql -q "SELECT CURRENT_USER() AS user, CURRENT_ACCOUNT() AS account, CURRENT_ROLE() AS role"
          echo "==> Connection OK"

      - name: Run SQL files
        run: |
          DB="${{ inputs.database }}"
          WH="${{ inputs.warehouse }}"
          BASE="S4/FIN/PNL/setup"

          run_sql() {
            echo ""
            echo "--> Running $(basename $1)"
            snow sql -f "$1" \
              --variable "db_name=${DB}" \
              --variable "wh_name=${WH}"
          }

          echo "==> Action: ${{ inputs.action }}  |  DB: ${DB}  |  WH: ${WH}"

          case "${{ inputs.action }}" in
            ping)
              echo "Connection test passed in previous step. No SQL files to run."
              ;;
            all)
              for f in "${BASE}"/[0-9][0-9]_*.sql; do run_sql "$f"; done
              ;;
            react-dashboard-only)
              echo "NOTE: Deploying React PnL Dashboard (pre-build strategy)."
              echo "  Step 1: Snowflake infra (compute pool)..."
              run_sql "${BASE}/10_dashboard_infra.sql"
              echo "  Step 2: npm install + build on this runner (internet available)..."
              cd S4/react-dashboard
              npm ci
              npm run build
              # Copy static assets into the standalone output directory
              cp -r .next/static  .next/standalone/.next/static
              cp -r public        .next/standalone/public
              # Copy app.yml into standalone — snow app deploy runs from there
              # so server.js is at the root of the upload (not .next/standalone/server.js)
              cp app.yml .next/standalone/app.yml
              echo "  Step 3: Deploy from .next/standalone/ — runtime node_modules travel with it..."
              cd .next/standalone
              snow app deploy --target "${{ inputs.deploy_target }}" --verbose
              ;;
            rbac-only)
              run_sql "${BASE}/03_rbac.sql"
              ;;
            data-only)
              run_sql "${BASE}/04_fact_table.sql"
              run_sql "${BASE}/05_data_seed.sql"
              ;;
            search-agent-only)
              run_sql "${BASE}/06_search.sql"
              run_sql "${BASE}/07_semantic_view.sql"
              run_sql "${BASE}/08_agent.sql"
              ;;
            verify)
              echo "NOTE: verify requires 'all' to have been run first."
              run_sql "${BASE}/09_verify.sql"
              ;;
            teardown)
              run_sql "S4/FIN/PNL/runbooks/teardown.sql"
              ;;
          esac

      - name: Write deployment summary
        if: always()
        run: |
          echo "## S4.FIN.PNL — S4 FIN PNL Demo" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Action | \`${{ inputs.action }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Database | \`${{ inputs.database }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Warehouse | \`${{ inputs.warehouse }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Status | ${{ job.status }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Triggered by | @${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
