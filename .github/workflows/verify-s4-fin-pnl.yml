name: Verify S4.FIN.PNL — S4 FIN PNL Demo

# Run verification queries without touching any objects.
# Use this after a deploy to confirm row counts, EBIT margins,
# and role-based data isolation are all working correctly.
on:
  workflow_dispatch:
    inputs:
      warehouse:
        description: 'Snowflake warehouse name'
        required: true
        default: 'SAP_BDC_PNL_WH'
      database:
        description: 'Target Snowflake database'
        required: true
        default: 'SAP_BDC_PNL'

jobs:
  verify:
    name: Verify S4.FIN.PNL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Snowflake CLI
        run: pip install snowflake-cli

      - name: Configure Snowflake connection
        env:
          SNOWFLAKE_ACCOUNT:     ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER:        ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.snowflake
          cat > ~/.snowflake/config.toml << EOF
          [connections.default]
          account          = "${SNOWFLAKE_ACCOUNT}"
          user             = "${SNOWFLAKE_USER}"
          authenticator    = "SNOWFLAKE_JWT"
          private_key_path = "/tmp/rsa_key.p8"
          role             = "ACCOUNTADMIN"
          EOF
          printf '%s' "${SNOWFLAKE_PRIVATE_KEY}" > /tmp/rsa_key.p8
          chmod 0600 /tmp/rsa_key.p8
          chmod 0600 ~/.snowflake/config.toml

      - name: Run verification
        run: |
          snow sql -f S4/FIN/PNL/setup/09_verify.sql \
            --variable "db_name=${{ inputs.database }}" \
            --variable "wh_name=${{ inputs.warehouse }}"

      - name: Write summary
        if: always()
        run: |
          echo "## S4.FIN.PNL Verification" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Database | \`${{ inputs.database }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Status | ${{ job.status }} |" >> "$GITHUB_STEP_SUMMARY"
